<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Slice Snake pizza-box panel concept</title><desc id="desc">Cream and red panel with a labeled placeholder for a future QR code. Not production artwork.</desc>
<rect width="900" height="560" rx="20" fill="#f5f0e5"/>
<rect x="22" y="22" width="856" height="516" rx="12" fill="none" stroke="#c43c26" stroke-width="2"/>
<g font-family="Arial, sans-serif" fill="#242820">
<text x="62" y="87" font-size="23" font-weight="bold" letter-spacing="2">SLICE SNAKE</text>
<text x="62" y="202" font-size="61" font-weight="bold" letter-spacing="-3">One more</text>
<text x="62" y="269" font-size="67" font-weight="bold" fill="#c43c26" letter-spacing="-3">bite.</text>
<text x="62" y="333" font-size="20">Scan. Play. Beat your best score.</text>
<text x="62" y="369" font-size="16" fill="#646759">Classic Snake. Fresh dimension.</text>
